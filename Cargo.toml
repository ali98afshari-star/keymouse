[package]
name = "keymouse"
version = "2.5.0"
edition = "2021"
description = "Hold one key and move the mouse with the arrow keys (Linux/X11)"
license = "MIT"
authors = ["Ali Afshari <ali98afshari@gmail.com>"]
repository = "https://github.com/ali98afshari-star/keymouse"

[lib]
name = "keymouse"
path = "src/lib.rs"

[[bin]]
name = "keymouse"
path = "src/bin/keymouse.rs"

[[bin]]
name = "keymouse-settings"
path = "src/bin/keymouse-settings.rs"

[dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
fs2 = "0.4"
signal-hook = "0.3"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.32"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
